# Branching campaign — variance pass (repeats=3) on the 8 CF7 showcase scenarios.
#
# Follow-up to cf7_showcase_branching (repeats=1), which suggested afc+rnd is
# the worst couple by median cost in pond mode — but on a SINGLE random seed.
# This pass repeats every couple 3 times (seeds 1/2/3, set by run_campaign via
# seed=repeat) to measure the variance of the random couples (size+rnd,
# afc+rnd). Deterministic couples (size+min, afc+min) should show ~zero spread
# (sanity check on determinism).
#
# Budget reduced to 90s (sp1 30s) so 96 runs fit in ~2h. This is a VARIANCE
# study, not an absolute-optimum study: costs here are NOT directly comparable
# to the 240s campaign, but ARE comparable across couples within this pass.
# Key question: is the afc+rnd / 2v-sp3 collapse (22287 vs ~5700) structural,
# or a bad-seed artefact?

name: cf7_showcase_branching_r3
description: |
  Variance pass (repeats=3, seeds 1/2/3) of the 4 branching couples on the 8
  CF7 showcase scenarios, solver BAB, objective pond, 90s budget. Measures the
  spread of the random couples to decide whether afc+rnd's poor median cost in
  the repeats=1 run is structural. 96 runs.

scenarios:
  - {cf: 7, voices: 2, species: [1],       v_types: [1],     preset: default, timeout_ms: 30000, stagnation_ms: 30000, obj_mode: pond}
  - {cf: 7, voices: 2, species: [2],       v_types: [2],     preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}
  - {cf: 7, voices: 2, species: [3],       v_types: [2],     preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}
  - {cf: 7, voices: 2, species: [5],       v_types: [1],     preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}
  - {cf: 7, voices: 3, species: [1, 1],    v_types: [4, 2],  preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}
  - {cf: 7, voices: 3, species: [2, 3],    v_types: [0, 2],  preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}
  - {cf: 7, voices: 3, species: [3, 3],    v_types: [0, 2],  preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}
  - {cf: 7, voices: 4, species: [1, 1, 1], v_types: [0, 1, 2], preset: default, timeout_ms: 90000, stagnation_ms: 90000, obj_mode: pond}

matrix:
  solvers:
    - bab
  branching:
    - {var_sel: size-min, val_sel: min, label: "original (fork)"}
    - {var_sel: size-min, val_sel: rnd, label: "size + random"}
    - {var_sel: afc-max,  val_sel: min, label: "afc + min (discarded)"}
    - {var_sel: afc-max,  val_sel: rnd, label: "afc + random (production)"}
  presets:
    - default

repeats: 3
